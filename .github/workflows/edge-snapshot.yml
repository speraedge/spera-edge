name: SPERA EDGE Snapshot

on:
  schedule:
    # Tue-Fri 09:00 IST (03:30 UTC) - Next day morning run
    - cron: '30 3 * * 2-5'
    # Saturday 10:00 IST (04:30 UTC) - Weekend catch-up
    - cron: '30 4 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build isolated NIFTY 500 snapshot
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          UPSTOX_ANALYTIC_TOKEN: ${{ secrets.UPSTOX_ANALYTIC_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if python -m tools.publish_edge_snapshot; then
              echo "Snapshot build succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed"
            if [ "$attempt" = "3" ]; then
              echo "Snapshot build failed after 3 attempts"
              exit 1
            fi
            sleep 60
          done

      - name: Validate complete snapshot files and metadata
        run: |
          python -c "from edge_core.snapshot_integrity import validate_snapshot; print(validate_snapshot())"

      - name: Publish dated current official membership and benchmark research
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 4 * * 6'
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          UPSTOX_ANALYTIC_TOKEN: ${{ secrets.UPSTOX_ANALYTIC_TOKEN }}
        run: python -m edge_evidence

      - name: Validate published membership and benchmark evidence
        continue-on-error: true
        run: |
          python -c "
          import pandas as pd
          from edge_workspace import load_current_evidence
          close = pd.read_csv('data/latest/close.csv', index_col='Date', parse_dates=['Date'])
          evidence, members, industries, benchmark = load_current_evidence('data/latest', close)
          print(f'Membership: {len(members)} rows; benchmark: {evidence.get(\"benchmark_status\")}')
          "

      - name: Enforce latest completed NSE session before live publication
        run: |
          python -c "
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from edge_core.ohlcv_integrity import snapshot_is_fresh
          meta = json.loads(open('data/latest/metadata.json').read())
          now_ist = datetime.now(ZoneInfo('Asia/Kolkata'))
          if not snapshot_is_fresh(meta['last_session'], now_ist):
              print('STALE_PROVIDER_SNAPSHOT')
              print(f'Last session: {meta[\"last_session\"]}, now IST: {now_ist.isoformat()}')
              raise SystemExit(1)
          print(f'Snapshot fresh: {meta[\"last_session\"]}')
          "

      - name: Publish validated leadership research to EDGE D1
        env:
          EDGE_CF_ACCOUNT_ID: ${{ secrets.EDGE_CF_ACCOUNT_ID }}
          EDGE_D1_DATABASE_ID: ${{ secrets.EDGE_D1_DATABASE_ID }}
          EDGE_CF_API_TOKEN: ${{ secrets.EDGE_CF_API_TOKEN }}
        run: |
          echo "D1 leadership publication START"
          python -m tools.publish_edge_d1
          echo "D1 leadership publication END"

      - name: Publish non-secret research snapshot to EDGE repository
        run: |
          git config --global user.name "speraedge-bot"
          git config --global user.email "bot@speraedge.local"
          git add data/latest
          git restore --staged data/latest/fundamentals_auto.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: research snapshot [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
