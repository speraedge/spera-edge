name: EDGE Live D1 Evidence Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install smoke dependencies
        run: python -m pip install requests pandas
      - name: Verify configured EDGE secrets
        env:
          EDGE_CF_ACCOUNT_ID: ${{ secrets.EDGE_CF_ACCOUNT_ID }}
          EDGE_D1_DATABASE_ID: ${{ secrets.EDGE_D1_DATABASE_ID }}
          EDGE_CF_API_TOKEN: ${{ secrets.EDGE_CF_API_TOKEN }}
        run: |
          test -n "$EDGE_CF_ACCOUNT_ID"
          test -n "$EDGE_D1_DATABASE_ID"
          test -n "$EDGE_CF_API_TOKEN"
      - name: Run isolated live D1 evidence smoke
        env:
          EDGE_CF_ACCOUNT_ID: ${{ secrets.EDGE_CF_ACCOUNT_ID }}
          EDGE_D1_DATABASE_ID: ${{ secrets.EDGE_D1_DATABASE_ID }}
          EDGE_CF_API_TOKEN: ${{ secrets.EDGE_CF_API_TOKEN }}
        run: python -m tools.verify_edge_d1 --live
