name: Official universe identity audit
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 6'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate NSE universes against Upstox instrument master
        run: python -m tools.build_universe_mapping
      - name: Upload independent research identity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-universe-identity-audit
          path: snapshot/
          retention-days: 14
