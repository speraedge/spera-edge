name: SPERA EDGE quality
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py edge_workspace.py edge_evidence.py edge_core tests tools
      - name: Explicit Phase 2 mplfinance candlestick renderer tests
        run: python -m unittest discover -s tests -p 'test_phase2_symbol_charts.py' -v
      - name: Full EDGE unit test suite
        run: python -m unittest discover -s tests -v
      - name: Explicit Phase 3 privacy and D1 isolation regression
        run: python -m unittest discover -s tests -p 'test_phase3_fundamentals.py' -v
      - name: Mandatory saved OHLCV replay regression (fail closed)
        run: PYTHONPATH=. python tools/verify_saved_ohlcv_replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spera-edge-upstox-replay
          path: artifacts/replay/
          if-no-files-found: warn
          retention-days: 30
