name: Initialize SPERA EDGE D1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Validate configured EDGE D1 credentials
        env:
          EDGE_CF_ACCOUNT_ID: ${{ secrets.EDGE_CF_ACCOUNT_ID }}
          EDGE_D1_DATABASE_ID: ${{ secrets.EDGE_D1_DATABASE_ID }}
          EDGE_CF_API_TOKEN: ${{ secrets.EDGE_CF_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          required=("EDGE_CF_ACCOUNT_ID","EDGE_D1_DATABASE_ID","EDGE_CF_API_TOKEN")
          missing=[k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit("Missing EDGE GitHub secrets: "+", ".join(missing))
          print("EDGE D1 credentials present; secret values not displayed")
          PY
      - name: Create EDGE tables and verify connection
        env:
          EDGE_CF_ACCOUNT_ID: ${{ secrets.EDGE_CF_ACCOUNT_ID }}
          EDGE_D1_DATABASE_ID: ${{ secrets.EDGE_D1_DATABASE_ID }}
          EDGE_CF_API_TOKEN: ${{ secrets.EDGE_CF_API_TOKEN }}
        run: |
          python -m tools.init_edge_d1
          python - <<'PY'
          from edge_core.d1_store import d1_query
          tables=d1_query("SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'edge_%' ORDER BY name")
          expected={"edge_snapshot_runs","edge_leadership","edge_sector_summary","edge_journal"}
          actual={x["name"] for x in tables}
          if not expected.issubset(actual):
              raise SystemExit("EDGE D1 schema verification failed")
          print("EDGE D1 schema verified:", ", ".join(sorted(actual)))
          PY
